<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXON Wallet</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #f8fafc; margin: 0; padding: 16px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 420px; }
        .card { background: #131b2e; border: 1px solid #1e293b; padding: 24px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .logo { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; margin-bottom: 12px; border: 2px solid #38bdf8; }
        h2 { margin: 0 0 8px 0; font-size: 22px; color: #fff; }
        p { color: #94a3b8; font-size: 14px; margin-top: 0; }
        .btn { background: #38bdf8; color: #0b0f19; border: none; padding: 14px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; font-size: 16px; margin-top: 15px; }
        .btn-secondary { background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8; }
        .balance-box { background: #0b0f19; border: 1px solid #1e293b; padding: 20px; border-radius: 16px; margin: 20px 0; text-align: left; }
        .balance-title { font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .balance-amount { font-size: 28px; font-weight: 800; color: #38bdf8; margin-top: 5px; }
        .wallet-address { font-size: 12px; color: #64748b; background: #1e293b; padding: 6px 12px; border-radius: 20px; display: inline-block; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 15px; border-radius: 10px; background: #0b0f19; border: 1px solid #334155; color: #fff; box-sizing: border-box; font-size: 14px; }
        label { font-size: 12px; color: #94a3b8; display: block; text-align: left; }
        .action-row { display: flex; gap: 10px; margin-top: 15px; }
        .hidden { display: none !important; }
        .status { font-size: 13px; padding: 10px; border-radius: 8px; margin-top: 15px; word-break: break-all; }
        .error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
        .success { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid #10b981; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Logo Image -->
            <img src="https://images.instasize.com/p/407d8ce9deeaf5eda304f1e995e9b95f31f610e325da41cd9c2493ebc43fae61" alt="AXON Logo" class="logo" crossorigin="anonymous">
            
            <h2>AXON Wallet</h2>

            <!-- Login View -->
            <div id="loginSection">
                <p>Secure mobile gateway for AXN tokens. Connect your Web3 wallet to manage assets.</p>
                <button class="btn" onclick="connectWallet()">Connect Wallet</button>
            </div>

            <!-- Dashboard View -->
            <div id="walletSection" class="hidden">
                <div class="wallet-address" id="accountText">0x...</div>
                
                <div class="balance-box">
                    <div class="balance-title">AXN Balance</div>
                    <div class="balance-amount" id="axnBalance">0.00</div>
                </div>

                <!-- Send Form Box -->
                <div style="text-align: left; background: #0b0f19; padding: 15px; border-radius: 16px; border: 1px solid #1e293b;">
                    <h3 style="margin: 0 0 12px 0; font-size: 15px; color: #fff;">Send AXN</h3>
                    <label>Recipient Address</label>
                    <input type="text" id="recipient" placeholder="0x...">
                    
                    <label>Amount</label>
                    <input type="number" id="amount" step="any" placeholder="0.00">
                    
                    <button class="btn" style="margin-top:0;" onclick="sendTokens()">Send Tokens</button>
                </div>

                <button class="btn btn-secondary" onclick="fetchBalance()">Refresh Balance</button>
            </div>

            <div id="statusMsg" class="hidden"></div>
        </div>
    </div>

    <script>
        const AXN_ADDRESS = "0xC7C101be3e01258A4e6111273a412656E36Cd1a3";
        const ABI = [
            "function balanceOf(address owner) view returns (uint256)",
            "function decimals() view returns (uint8)",
            "function transfer(address to, uint256 amount) returns (bool)"
        ];
        
        let provider, signer, account, contract;

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    const accounts = await provider.send("eth_requestAccounts", []);
                    account = accounts[0];
                    signer = await provider.getSigner();
                    contract = new ethers.Contract(AXN_ADDRESS, ABI, signer);

                    document.getElementById("accountText").innerText = account.substring(0, 6) + "..." + account.substring(38);
                    document.getElementById("loginSection").classList.add("hidden");
                    document.getElementById("walletSection").classList.remove("hidden");

                    await fetchBalance();
                } catch (err) {
                    showStatus(err.message, "error");
                }
            } else {
                showStatus("Please open this page inside a Web3 wallet app (like MetaMask browser).", "error");
            }
        }

        async function fetchBalance() {
            try {
                showStatus("Fetching latest balance...", "success");
                const rawBal = await contract.balanceOf(account);
                const decimals = await contract.decimals();
                const formatted = ethers.formatUnits(rawBal, decimals);
                document.getElementById("axnBalance").innerText = Number(formatted).toLocaleString(undefined, {maximumFractionDigits: 4});
                hideStatus();
            } catch (err) {
                showStatus("Error loading balance: " + err.message, "error");
            }
        }

        async function sendTokens() {
            const recipient = document.getElementById("recipient").value;
            const amount = document.getElementById("amount").value;

            if (!recipient || !amount) {
                showStatus("Please fill in all fields.", "error");
                return;
            }

            try {
                showStatus("Confirm transaction in your wallet...", "success");
                const decimals = await contract.decimals();
                const parsedAmount = ethers.parseUnits(amount, decimals);
                
                const tx = await contract.transfer(recipient, parsedAmount);
                showStatus("Transaction sent! Waiting for confirmation...", "success");
                
                await tx.wait();
                showStatus("Transaction confirmed successfully!", "success");
                await fetchBalance();
            } catch (err) {
                showStatus(err.reason || err.message, "error");
            }
        }

        function showStatus(text, type) {
            const msg = document.getElementById("statusMsg");
            msg.innerText = text;
            msg.className = "status " + type;
        }

        function hideStatus() {
            document.getElementById("statusMsg").className = "hidden";
        }
    </script>
</body>
</html>

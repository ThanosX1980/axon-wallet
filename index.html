<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXON Wallet</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; width: 100%; max-width: 400px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        input { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: #fff; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>AXON Wallet</h2>
        <div id="loginSection">
            <p style="color: #94a3b8; font-size: 14px;">Connect your mobile Web3 wallet (like MetaMask or Trust Wallet browser) to view your AXN balance.</p>
            <button onclick="connectWallet()">Connect Wallet</button>
        </div>
        <div id="walletSection" class="hidden">
            <p style="font-size: 12px; color: #38bdf8; word-break: break-all;" id="accountText"></p>
            <div style="background: #0f172a; padding: 12px; border-radius: 8px; margin: 15px 0;">
                <span style="color: #94a3b8; font-size: 12px;">AXN Balance:</span>
                <div id="axnBalance" style="font-size: 20px; font-weight: bold; color: #38bdf8;">0.00</div>
            </div>
        </div>
    </div>

    <script>
        const AXN_ADDRESS = "0xC7C101be3e01258A4e6111273a412656E36Cd1a3";
        const ABI = ["function balanceOf(address owner) view returns (uint256)", "function decimals() view returns (uint8)"];
        
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const provider = new ethers.BrowserProvider(window.ethereum);
                    const accounts = await provider.send("eth_requestAccounts", []);
                    const account = accounts[0];
                    
                    document.getElementById("accountText").innerText = "Connected: " + account;
                    document.getElementById("loginSection").classList.add("hidden");
                    document.getElementById("walletSection").classList.remove("hidden");

                    const signer = await provider.getSigner();
                    const contract = new ethers.Contract(AXN_ADDRESS, ABI, signer);
                    const rawBal = await contract.balanceOf(account);
                    const decimals = await contract.decimals();
                    document.getElementById("axnBalance").innerText = ethers.formatUnits(rawBal, decimals) + " AXN";
                } catch (err) {
                    alert("Error: " + err.message);
                }
            } else {
                alert("Please open this page inside a Web3 crypto wallet browser (like MetaMask mobile app browser).");
            }
        }
    </script>
</body>
</html>

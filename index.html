<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXON Wallet</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AXON Wallet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #07090e; color: #f8fafc; margin: 0; padding: 16px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 400px; }
        .card { background: #101726; border: 1px solid #1e293b; padding: 24px; border-radius: 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); text-align: center; }
        
        .logo-badge { width: 72px; height: 72px; margin: 0 auto 16px auto; background: linear-gradient(135deg, #38bdf8, #0284c7); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4); }

        h2 { margin: 0 0 6px 0; font-size: 24px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
        p { color: #94a3b8; font-size: 13px; margin-top: 0; line-height: 1.5; }
        
        .btn { background: #38bdf8; color: #07090e; border: none; padding: 14px; border-radius: 14px; font-weight: 700; width: 100%; cursor: pointer; font-size: 15px; margin-top: 12px; }
        .btn-secondary { background: #1e293b; color: #38bdf8; border: 1px solid #334155; margin-top: 10px; }
        
        .balance-box { background: #07090e; border: 1px solid #1e293b; padding: 20px; border-radius: 18px; margin: 20px 0; text-align: left; }
        .balance-title { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .balance-amount { font-size: 32px; font-weight: 800; color: #38bdf8; margin-top: 6px; letter-spacing: -1px; }
        
        .wallet-badge { font-size: 11px; color: #38bdf8; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); padding: 6px 12px; border-radius: 20px; display: inline-block; margin-bottom: 16px; font-family: monospace; }
        
        .input-group { text-align: left; background: #07090e; padding: 16px; border-radius: 18px; border: 1px solid #1e293b; margin-bottom: 12px; }
        input, select { width: 100%; padding: 12px; margin-top: 4px; margin-bottom: 12px; border-radius: 10px; background: #101726; border: 1px solid #334155; color: #fff; box-sizing: border-box; font-size: 14px; outline: none; }
        label { font-size: 11px; color: #94a3b8; display: block; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .hidden { display: none !important; }
        .status { font-size: 13px; padding: 12px; border-radius: 12px; margin-top: 15px; word-break: break-all; text-align: left; }
        .error { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
        .success { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo-badge">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#07090e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path>
                    <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path>
                    <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path>
                </svg>
            </div>
            
            <h2>AXON Wallet</h2>

            <!-- Initial Login State -->
            <div id="loginSection">
                <p>Manage and transfer your tokens securely on-chain.</p>
                <button class="btn" onclick="connectWallet()">Connect Wallet</button>
                <button class="btn btn-secondary" id="installBtn" onclick="installApp()">📲 Download / Install App</button>
            </div>

            <!-- Active Wallet Dashboard -->
            <div id="walletSection" class="hidden">
                <div class="wallet-badge" id="accountText">0x...</div>
                
                <!-- Action Buttons: Receive & Refresh -->
                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <button class="btn" style="margin-top:0; background: #10b981; color: #fff;" onclick="showReceiveModal()">📥 Receive</button>
                    <button class="btn btn-secondary" style="margin-top:0;" onclick="fetchBalance()">🔄 Refresh</button>
                </div>

                <!-- Token Selector Dropdown -->
                <div style="margin-bottom: 12px; text-align: left;">
                    <label>Select Asset</label>
                    <select id="tokenSelect" onchange="switchToken()">
                        <option value="AXN">AXON (AXN)</option>
                        <option value="USDT">Tether USD (USDT)</option>
                        <option value="USDC">USD Coin (USDC)</option>
                        <option value="BUSD">Binance USD (BUSD)</option>
                        <option value="DAI">Dai Stablecoin (DAI)</option>
                        <option value="WBNB">Wrapped BNB (WBNB)</option>
                        <option value="ETH">Ethereum (ETH)</option>
                        <option value="BTCB">Bitcoin (BTCB)</option>
                        <option value="CAKE">PancakeSwap (CAKE)</option>
                        <option value="LINK">Chainlink (LINK)</option>
                        <option value="XRP">Ripple (XRP)</option>
                    </select>
                </div>

                <div class="balance-box">
                    <div class="balance-title" id="balanceTitle">AXN Balance</div>
                    <div class="balance-amount" id="axnBalance">0.00</div>
                </div>

                <!-- Send Transfer Module -->
                <div class="input-group">
                    <div style="font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 10px;" id="sendTitle">Send AXN</div>
                    <label>Recipient Address</label>
                    <input type="text" id="recipient" placeholder="0x...">
                    
                    <label>Amount</label>
                    <input type="number" id="amount" step="any" placeholder="0.00">
                    
                    <button class="btn" style="margin-top:0;" onclick="sendTokens()">Send Tokens</button>
                </div>
            </div>

            <div id="statusMsg" class="hidden"></div>
        </div>
    </div>

    <script>
        const TOKENS = {
            AXN: { address: "0xC7C101be3e01258A4e6111273a412656E36Cd1a3", symbol: "AXN" },
            USDT: { address: "0x55d398326f99059ff775485246999027b3197955", symbol: "USDT" },
            USDC: { address: "0x8ac76a51cc950d9822d68b83fe1ad97b32cd580d", symbol: "USDC" },
            BUSD: { address: "0xe9e7cea3dedca5984780bafc599bd69add087d56", symbol: "BUSD" },
            DAI: { address: "0x1af3f329e8be154074d8769d1ffa4ee058b1dbc3", symbol: "DAI" },
            WBNB: { address: "0xbb4cdb9cbd36b01bd1cbaebf2de08d9173bc095c", symbol: "WBNB" },
            ETH: { address: "0x2170ed0880ac9a755fd29b2688956bd959f933f8", symbol: "ETH" },
            BTCB: { address: "0x7130d2a12b9bcbfae4f2634d864a1ee1ce3ead9c", symbol: "BTCB" },
            CAKE: { address: "0x0e09fabb73bdadeabe0c41393587dbe4b0e25fa1", symbol: "CAKE" },
            LINK: { address: "0xf8a0bf9cf54bb92f17374d9e9a321e6a111a51bd", symbol: "LINK" },
            XRP: { address: "0x1d2f0da169ceb9fc7b3144628db156f3f6c60dbe", symbol: "XRP" }
        };

        const ABI = [
            "function balanceOf(address owner) view returns (uint256)",
            "function decimals() view returns (uint8)",
            "function transfer(address to, uint256 amount) returns (bool)"
        ];
        
        let provider, signer, account;
        let currentSymbol = "AXN";
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    deferredPrompt = null;
                });
            } else {
                alert("To install AXON Wallet:\n\n• iPhone/iPad: Tap Share in Safari -> 'Add to Home Screen'.\n• Android/Desktop: Use browser menu -> 'Install app'.");
            }
        }

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    const accounts = await provider.send("eth_requestAccounts", []);
                    account = accounts[0];
                    setupApp();
                } catch (err) {
                    showStatus(err.message, "error");
                }
            } else {
                window.location.href = `https://metamask.app.link/dapp/${window.location.host}${window.location.pathname}`;
            }
        }

        async function setupApp() {
            try {
                signer = await provider.getSigner();
                document.getElementById("accountText").innerText = account.substring(0, 6) + "..." + account.substring(38);
                document.getElementById("loginSection").classList.add("hidden");
                document.getElementById("walletSection").classList.remove("hidden");
                await fetchBalance();
            } catch (err) {
                showStatus(err.message, "error");
            }
        }

        function showReceiveModal() {
            navigator.clipboard.writeText(account);
            showStatus("Receive Address Copied to Clipboard: " + account, "success");
        }

        async function switchToken() {
            const selector = document.getElementById("tokenSelect");
            currentSymbol = selector.value;
            document.getElementById("balanceTitle").innerText = `${currentSymbol} Balance`;
            document.getElementById("sendTitle").innerText = `Send ${currentSymbol}`;
            await fetchBalance();
        }

        async function fetchBalance() {
            try {
                showStatus(`Syncing ${currentSymbol} balance...`, "success");
                const tokenConfig = TOKENS[currentSymbol];
                const activeContract = new ethers.Contract(tokenConfig.address, ABI, signer);

                const rawBal = await activeContract.balanceOf(account);
                const decimals = await activeContract.decimals();
                const formatted = ethers.formatUnits(rawBal, decimals);
                
                document.getElementById("axnBalance").innerHTML = Number(formatted).toLocaleString(undefined, {maximumFractionDigits: 4}) + ` <span style="font-size: 16px; color: #94a3b8; font-weight: 500;">${currentSymbol}</span>`;
                hideStatus();
            } catch (err) {
                showStatus("Failed to fetch balance: " + err.message, "error");
            }
        }

        async function sendTokens() {
            const recipient = document.getElementById("recipient").value;
            const amount = document.getElementById("amount").value;

            if (!recipient || !amount) {
                showStatus("Please fill in all fields.", "error");
                return;
            }

            try {
                showStatus(`Approve ${currentSymbol} transfer in your wallet...`, "success");
                const tokenConfig = TOKENS[currentSymbol];
                const activeContract = new ethers.Contract(tokenConfig.address, ABI, signer);

                const decimals = await activeContract.decimals();
                const parsedAmount = ethers.parseUnits(amount, decimals);
                
                const tx = await activeContract.transfer(recipient, parsedAmount);
                showStatus("Transaction broadcasted! Waiting...", "success");
                
                await tx.wait();
                showStatus("Transfer completed successfully!", "success");
                document.getElementById("recipient").value = "";
                document.getElementById("amount").value = "";
                await fetchBalance();
            } catch (err) {
                showStatus(err.reason || err.message, "error");
            }
        }

        function showStatus(text, type) {
            const msg = document.getElementById("statusMsg");
            msg.innerText = text;
            msg.className = "status " + type;
        }

        function hideStatus() {
            document.getElementById("statusMsg").className = "hidden";
        }
    </script>
</body>
</html>
